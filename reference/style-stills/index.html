<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circular crater reference set</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        color: #d6d6d6;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.4;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #9a9a9a;
      }
      figure {
        margin: 0 0 32px;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }
      figcaption {
        margin-top: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Circular crater reference set</h1>
      <p>
        One world, eight cameras. Review in this order. Shape and behavior:
        ../crater-environment.md
      </p>

      <figure>
        <img src="crater-two-ledges-wide.png" alt="Wide circular crater with both ledges" />
        <figcaption>1. Primary layout. Blue terrace left, yellow terrace right, court in mist.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-side-profile.png" alt="Side profile of both ledges" />
        <figcaption>2. Side profile. Both ledges cut into the mountains.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-orbit.png" alt="Orbit view of the full rim" />
        <figcaption>3. Orbit. Closed ring.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-overhead.png" alt="True overhead of the crater" />
        <figcaption>4. Overhead. Blue pole, yellow pole, court on the axis.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-overhead-tilt.png" alt="Tilted overhead showing mountain height" />
        <figcaption>5. Tilted overhead. Height of the peaks around the small ledges.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-yellow-stand.png" alt="From the yellow ledge looking at blue" />
        <figcaption>6. Yellow stand. Player 2 eye height looking at the blue ledge.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-court-toward-yellow.png" alt="From the court looking toward yellow" />
        <figcaption>7. Court level, toward yellow. Gamefield in the mist.</figcaption>
      </figure>
      <figure>
        <img src="crater-angle-court-toward-blue.png" alt="From the court looking toward blue" />
        <figcaption>8. Court level, toward blue. Same court, opposite rim.</figcaption>
      </figure>
    </main>
  </body>
</html>
